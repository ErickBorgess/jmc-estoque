<body class="bg-jmc-blue"
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-16">
        
        <!-- SEÇÃO: CATÁLOGO DE PRODUTOS -->
        <section id="catalogo" class="scroll-mt-24">
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-white uppercase tracking-wide">Calculadora de Cabos</h2>
                <p class="text-2xl font-regular text-white uppercase tracking-wide">estimativa de metragem de cabos</p>
                <div class="w-24 h-1 bg-jmc-orange mx-auto mt-3 rounded"></div>
            </div>

            <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-100 max-w-4xl mx-auto">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-4 gap-2">
                    <h3 class="text-xl font-semibold text-gray-800">Filtros de Pesquisa</h3>
                    <p id="last-update" class="text-sm font-medium text-gray-500 bg-gray-50 px-3 py-1 rounded-full border">Carregando...</p>
                </div>

                <!-- Grid de Inputs de Busca -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Peso atual -->
                    <div>
                        <label for="buscaNome" class="block text-sm font-semibold text-gray-700 mb-1">Por Nome</label>
                        <div class="flex rounded-md shadow-sm">
                            <input type="text" id="buscaNome" class="focus:ring-jmc-blue focus:border-jmc-blue flex-1 block w-full rounded-l-md sm:text-sm border-gray-300 border p-2.5 outline-none" placeholder="Ex: Cimento, Bloco...">
                            <button onclick="buscarPorNome()" id="btnBuscaNome" class="bg-jmc-blue text-white px-5 py-2.5 rounded-r-md hover:bg-opacity-90 font-semibold transition-colors">Buscar</button>
                        </div>
                    </div>

                    <!-- Por EAN -->
                    <div>
                        <label for="buscaCodigoEan" class="block text-sm font-semibold text-gray-700 mb-1">Cabo 1.5mm</label>
                        <div class="flex rounded-md shadow-sm">
                            <button onclick="buscarPorCodigoEan()" id="btnBuscaCodigoEan" class="bg-jmc-blue text-white px-5 py-2.5 rounded-r-md hover:bg-opacity-90 font-semibold transition-colors">Buscar</button>
                        </div>
                    </div>

                    <!-- Por Código Interno -->
                    <div>
                        <label for="buscaCodigo" class="block text-sm font-semibold text-gray-700 mb-1">Cabo 2.5mm</label>
                        <div class="flex rounded-md shadow-sm">
                            <button onclick="buscarPorCodigo()" id="btnBuscaCodigo" class="bg-jmc-blue text-white px-5 py-2.5 rounded-r-md hover:bg-opacity-90 font-semibold transition-colors">Buscar</button>
                        </div>
                    </div>

                    <!-- Por Referência -->
                    <div>
                        <label for="buscaRef" class="block text-sm font-semibold text-gray-700 mb-1">Cabo 4mm</label>
                        <div class="flex rounded-md shadow-sm">
                            <button onclick="buscarPorReferencia()" id="btnBuscaRef" class="bg-jmc-blue text-white px-5 py-2.5 rounded-r-md hover:bg-opacity-90 font-semibold transition-colors">Buscar</button>
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex justify-center">
                    <button onclick="limparBusca()" id="btnLimparBusca" class="text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-6 py-2 rounded-md font-semibold transition-colors">
                        Limpar Todos os Campos
                    </button>
                </div>
            </div>

            <!-- Área de Resultados Dinâmica -->
            <div id="resultados" class="mt-8 max-w-4xl mx-auto">
                <div id="feedback" class="text-center text-gray-500 py-12 bg-white rounded-xl shadow-sm border border-gray-100">
                    <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <p class="text-lg">Utilize os campos acima para buscar um produto.</p>
                </div>
            </div>
        </section>
    </main>
 </body>
    
    <script>
        function calcular() {
            const pesoAtual = parseFloat(document.getElementById('pesoAtual').value);
            const pesoRolo = parseFloat(document.getElementById('pesoRolo').value);

            if (isNaN(pesoAtual) || isNaN(pesoRolo) || pesoRolo <= 0) {
                alert('Por favor, insira valores válidos para peso atual e peso total.');
                return;
            }

            const resultado = (pesoAtual * 100) / pesoRolo;
            exibirResultado(resultado.toFixed(2));
        }
        const exibirResultado = (resultado) => {
            const resultadosDiv = document.getElementById('resultados');
            document.getElementById('resultados').innerHTML = ''; // Limpa a área de resultado
            const lista = document.createElement('div');
            lista.className = 'space-y-4';
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-lg shadow-sm border border-gray-200';
            card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900">Quantidade aproximada:</h3>
                            <p class="text-lg font-bold text-blue-600">${resultado}m </p>
                        </div>
                    </div>
                `;
            lista.appendChild(card);

            resultadosDiv.appendChild(lista);
        };
    </script>
</body>

</html>
