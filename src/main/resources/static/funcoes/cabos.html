<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Cabos</title>
    <link rel="icon" type="image/png" href="images/favicon.ico">
    <link rel="manifest" href="images/site.webmanifest" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .loader {
            border-top-color: #2563EB;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-[#0B2559] text-gray-800 align-middle"> ">
    <div class="container mx-auto p-4 max-w-3xl">
        <header class="text-center mt-3 mb-3 space-y-2">
            <h1 class="text-3xl font-bold text-[WHITE]">CALCULADORA DE CABOS</h1>
            <div class="text-center mb-6 hidden md:block">
            </div>
        </header>
        <main>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="space-y-4 flex-1 columns-2">
                    <div>
                        <label for="kgAtual" class="block text-sm font-medium text-gray-700">Peso atual (kg)</label>
                        <div class="mt-1 flex rounded-md shadow-sm">
                            <input type="text" id="pesoAtual"
                                class="focus:ring-blue-500 focus:border-blue-500 flex-1 block w-full rounded-none rounded-l-md sm:text-sm border-gray-300 p-2"
                                placeholder="Iserir peso...">
                        </div>
                    </div>
                    <div>
                        <label for="kgRolo" class="block text-sm font-medium text-gray-700">Peso do rolo (kg)</label>
                        <div class="mt-1 flex rounded-md shadow-sm">
                            <input type="text" id="pesoRolo"
                                class="focus:ring-blue-500 focus:border-blue-500 flex-1 block w-full rounded-none rounded-l-md sm:text-sm border-gray-300 p-2"
                                placeholder="Iserir peso...">
                        </div>
                    </div>
                </div>
                <div class="mt-6 mb-6">
                    <button onclick="calcular()" id="btnCalcular"
                        class="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 font-semibold">Calcular</button>
                </div>
                <div id="resultados" class="mb-4">
                    <div id="feedback" class="text-center text-gray-500 py-10 bg-white rounded-lg shadow-md">
                        <p>Realize algum calculo.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
        function calcular() {
            const pesoAtual = parseFloat(document.getElementById('pesoAtual').value);
            const pesoRolo = parseFloat(document.getElementById('pesoRolo').value);

            if (isNaN(pesoAtual) || isNaN(pesoRolo) || pesoRolo <= 0) {
                alert('Por favor, insira valores válidos para peso atual e peso total.');
                return;
            }

            const resultado = (pesoAtual * 100) / pesoRolo;
            exibirResultado(resultado.toFixed(2));
        }
        const exibirResultado = (resultado) => {
            const resultadosDiv = document.getElementById('resultados');
            document.getElementById('resultados').innerHTML = ''; // Limpa a área de resultado
            const lista = document.createElement('div');
            lista.className = 'space-y-4';
            const card = document.createElement('div');
            card.className = 'bg-white p-5 rounded-lg shadow-sm border border-gray-200';
            card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900">Quantidade aproximada:</h3>
                            <p class="text-lg font-bold text-blue-600">${resultado}m </p>
                        </div>
                    </div>
                `;
            lista.appendChild(card);

            resultadosDiv.appendChild(lista);
        };
    </script>
</body>

</html>
