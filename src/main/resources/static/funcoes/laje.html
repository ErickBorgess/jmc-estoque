<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>LAJE</title>
    
</head>

<body>
    <!-- SEÇÃO: CATÁLOGO DE PRODUTOS -->
    <section id="catalogo" class="scroll-mt-24">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-jmc-blue uppercase tracking-wide">Busca de Produtos</h2>
            <div class="w-24 h-1 bg-jmc-orange mx-auto mt-3 rounded"></div>
        </div>

        <div class="bg-white p-6 md:p-8 rounded-xl shadow-lg border border-gray-100 max-w-4xl mx-auto">

            <!-- Grid de Inputs de Busca -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Por Nome -->
                <div>
                    <label for="buscaNome" class="block text-sm font-semibold text-gray-700 mb-1">Por Nome</label>
                    <div class="flex rounded-md shadow-sm">
                        <input type="text" id="buscaNome"
                            class="focus:ring-jmc-blue focus:border-jmc-blue flex-1 block w-full rounded-l-md sm:text-sm border-gray-300 border p-2.5 outline-none"
                            placeholder="Ex: Cimento, Bloco...">
                        <button onclick="buscarPorNome()" id="btnBuscaNome"
                            class="bg-jmc-blue text-white px-5 py-2.5 rounded-r-md hover:bg-opacity-90 font-semibold transition-colors">Buscar</button>
                    </div>
                </div>

                <!-- Por EAN -->
                <div>
                    <label for="buscaCodigoEan" class="block text-sm font-semibold text-gray-700 mb-1">Por Código de
                        Barras</label>
                    <div class="flex rounded-md shadow-sm">
                        <input type="text" id="buscaCodigoEan"
                            class="focus:ring-jmc-blue focus:border-jmc-blue flex-1 block w-full rounded-l-md sm:text-sm border-gray-300 border p-2.5 outline-none"
                            placeholder="Leia o código...">
                        <button onclick="buscarPorCodigoEan()" id="btnBuscaCodigoEan"
                            class="bg-jmc-blue text-white px-5 py-2.5 rounded-r-md hover:bg-opacity-90 font-semibold transition-colors">Buscar</button>
                    </div>
                </div>

            <div class="mt-8 flex justify-center">
                <button onclick="limparBusca()" id="btnLimparBusca"
                    class="text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-6 py-2 rounded-md font-semibold transition-colors">
                    Limpar Todos os Campos
                </button>
            </div>
        </div>

        <!-- Área de Resultados Dinâmica -->
        <div id="resultados" class="mt-8 max-w-4xl mx-auto">
            <div id="feedback"
                class="text-center text-gray-500 py-12 bg-white rounded-xl shadow-sm border border-gray-100">
                <svg class="mx-auto h-12 w-12 text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <p class="text-lg">Utilize os campos acima para buscar um produto.</p>
            </div>
        </div>
    </section>
</body>

</html>
